spring:
  application:
    name: evmTracker
  datasource:
    url: jdbc:postgresql://localhost:5432/evm_tracker
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: my-very-secret-key-that-is-long-enough-for-hs256
  expiration-ms: 86400000
  refresh-expiration-ms: 86400000

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.trycore.evmTracker: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
