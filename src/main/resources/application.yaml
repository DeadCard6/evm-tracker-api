spring:
  application:
    name: evmTracker
  datasource:
    url: jdbc:h2:mem:evmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: my-very-secret-key-that-is-long-enough-for-hs256
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000
